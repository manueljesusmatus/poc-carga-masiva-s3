spring:
  profiles:
    active: virtual
  application:
    name: poc-carga-masiva-s3
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 60s
  datasource:
    url: jdbc:h2:mem:shedlock_DB;INIT=CREATE SCHEMA IF NOT EXISTS shedlock;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
      settings.trace: false
      settings.web-allow-others: false

upload:
  scheduler:
    cron: "0/15 * * * * ?"
    lock-at-least-for: PT20S
    lock-at-most-for: PT20S
    task-count: 25
  executor:
    thread-name-prefix: upload-
    await-termination: 60s
    custom:
      core-pool-size: 5
      max-pool-size: 5
      queue-capacity: 10
    fixed:
      pool-size: 5
    cached:
      keep-alive: 60s
    virtual:
      concurrency-limit: 5

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    cl.dev.mmatush.poc: TRACE